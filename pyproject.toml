[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tablecheck-starter"
version = "0.1.0"
description = "Read-only CSV validation against small, explicit JSON schemas"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Jbutler23-ai"}]
dependencies = []

[project.scripts]
tablecheck = "tablecheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
